<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Speedruns | Extreme Coaching</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,900;1,900&family=Roboto:wght@400;700&display=swap');

        :root {
            --bg-dark: #09090b;
            --card-bg: #18181b;
            --beast-blue: #00f2fe;
            --beast-pink: #fe0979;
            --beast-yellow: #ffea00;
            --text-light: #fafafa;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* Hero Section */
        header {
            text-align: center;
            padding: 5rem 1rem 3rem;
            background: linear-gradient(180deg, rgba(0,242,254,0.1) 0%, var(--bg-dark) 100%);
            border-bottom: 2px solid #27272a;
        }

        h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 4rem;
            text-transform: uppercase;
            margin: 0;
            letter-spacing: -2px;
            color: var(--text-light);
            text-shadow: 0 0 20px rgba(0, 242, 254, 0.5);
        }

        .highlight {
            color: var(--beast-pink);
            text-shadow: 0 0 20px rgba(254, 9, 121, 0.5);
        }

        .subtitle {
            font-size: 1.2rem;
            max-width: 700px;
            margin: 1.5rem auto;
            color: #a1a1aa;
        }

        /* Filter Bar */
        .filter-container {
            text-align: center;
            margin: 2rem 0;
        }

        .filter-btn {
            background: transparent;
            color: var(--text-light);
            border: 2px solid #3f3f46;
            padding: 0.8rem 1.5rem;
            margin: 0 0.5rem;
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
            text-transform: uppercase;
        }

        .filter-btn:hover, .filter-btn.active {
            border-color: var(--beast-blue);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
            background: rgba(0, 242, 254, 0.1);
        }

        /* Dynamic Grid */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 2rem 4rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2rem;
        }

        /* Session Cards */
        .card {
            background-color: var(--card-bg);
            border: 2px solid #27272a;
            border-radius: 12px;
            padding: 2rem;
            position: relative;
            transition: transform 0.3s, box-shadow 0.3s;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: var(--beast-pink);
            box-shadow: 0 15px 30px rgba(254, 9, 121, 0.2);
            z-index: 10;
        }

        .badge-container {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
        }

        .badge {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.8rem;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            text-transform: uppercase;
            font-weight: 900;
        }

        .badge-curriculum {
            background-color: var(--beast-blue);
            color: #000;
        }

        .badge-intensity {
            background-color: var(--beast-yellow);
            color: #000;
        }

        .card h2 {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.5rem;
            margin: 0 0 1rem 0;
            line-height: 1.2;
        }

        .price {
            font-size: 2.5rem;
            font-family: 'Montserrat', sans-serif;
            color: var(--text-light);
            margin-bottom: 1rem;
        }

        .price span {
            font-size: 1rem;
            color: var(--beast-pink);
        }

        .description {
            color: #d4d4d8;
            flex-grow: 1;
            margin-bottom: 2rem;
        }

        .book-btn {
            background: var(--beast-pink);
            color: white;
            border: none;
            padding: 1.2rem;
            font-family: 'Montserrat', sans-serif;
            font-size: 1.2rem;
            font-weight: 900;
            cursor: pointer;
            border-radius: 8px;
            text-transform: uppercase;
            transition: background 0.2s, transform 0.1s;
            width: 100%;
        }

        .book-btn:hover {
            background: #d90066;
            transform: scale(1.05);
        }

        /* Modal UX */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(5px);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: var(--card-bg);
            border: 2px solid var(--beast-blue);
            padding: 3rem;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            position: relative;
            box-shadow: 0 0 40px rgba(0, 242, 254, 0.2);
        }

        .close-btn {
            position: absolute;
            top: 1rem; right: 1.5rem;
            font-size: 2rem;
            color: #71717a;
            cursor: pointer;
        }

        .close-btn:hover { color: white; }

        input, select {
            width: 100%;
            padding: 1rem;
            margin-bottom: 1.5rem;
            background: var(--bg-dark);
            border: 1px solid #3f3f46;
            color: white;
            font-family: 'Roboto', sans-serif;
            border-radius: 6px;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: var(--beast-blue);
        }

        .pay-btn {
            background: var(--beast-blue);
            color: #000;
        }
        .pay-btn:hover { background: #00d2de; }

    </style>
</head>
<body>

    <header>
        <h1>Math <span class="highlight">Speedruns</span></h1>
        <p class="subtitle">Bilingual, high-stakes coaching for International Schools in Thailand. Stop memorizing. Start dominating the exam board. Choose your gauntlet.</p>
        
        <div class="filter-container" id="filterBar">
            <button class="filter-btn active" onclick="filterSessions('All')">All Challenges</button>
            <button class="filter-btn" onclick="filterSessions('IGCSE')">IGCSE</button>
            <button class="filter-btn" onclick="filterSessions('IB')">IB DP</button>
            <button class="filter-btn" onclick="filterSessions('A-Level')">A-Level</button>
        </div>
    </header>

    <div class="container">
        <div class="grid" id="sessionGrid">
            </div>
    </div>

    <div class="modal" id="bookingModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 id="modalTitle" style="font-family: 'Montserrat', sans-serif; margin-top: 0;">SECURE YOUR SLOT</h2>
            <div class="price" id="modalPrice">0 <span>THB</span></div>
            
            <form id="bookingForm" onsubmit="processBooking(event)">
                <input type="hidden" id="sessionId">
                <input type="text" id="studentName" required placeholder="Student's Full Name">
                <input type="email" id="parentEmail" required placeholder="Parent's Email Address">
                <select id="schoolName" required>
                    <option value="" disabled selected>Select International School</option>
                    <option value="Prem">Prem Tinsulanonda</option>
                    <option value="CMIS">CMIS</option>
                    <option value="NIST">NIST</option>
                    <option value="Bangkok Patana">Bangkok Patana</option>
                    <option value="Other">Other</option>
                </select>
                <button type="submit" class="book-btn pay-btn">PROCEED TO SECURE CHECKOUT</button>
            </form>
        </div>
    </div>

    <script>
        let allSessions = [];

        // 1. Fetch and Parse the JSONL File
        async function loadSessions() {
            try {
                const response = await fetch('sessions.jsonl');
                const text = await response.text();
                
                // Split by newline and parse each line that isn't empty
                allSessions = text.split('\n')
                                  .filter(line => line.trim() !== '')
                                  .map(line => JSON.parse(line));
                
                renderGrid(allSessions);
            } catch (error) {
                console.error('Error loading sessions:', error);
                document.getElementById('sessionGrid').innerHTML = '<p style="color:red; text-align:center;">Failed to load challenges. Ensure local server is running.</p>';
            }
        }

        // 2. Render Cards to the DOM
        function renderGrid(sessions) {
            const grid = document.getElementById('sessionGrid');
            grid.innerHTML = ''; // Clear current grid

            sessions.forEach(session => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="badge-container">
                        <span class="badge badge-curriculum">${session.curriculum}</span>
                        <span class="badge badge-intensity">${session.intensity}</span>
                    </div>
                    <h2>${session.title}</h2>
                    <div class="price">${session.price_thb.toLocaleString()} <span>THB / ${session.duration}</span></div>
                    <p class="description">${session.description}</p>
                    <button class="book-btn" onclick="openModal('${session.id}', '${session.title.replace(/'/g, "\\'")}', ${session.price_thb})">ACCEPT CHALLENGE</button>
                `;
                grid.appendChild(card);
            });
        }

        // 3. Filter Logic
        function filterSessions(curriculum) {
            // Update active button state
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            if (curriculum === 'All') {
                renderGrid(allSessions);
            } else {
                const filtered = allSessions.filter(s => s.curriculum === curriculum);
                renderGrid(filtered);
            }
        }

        // 4. Modal & Booking Logic
        function openModal(id, title, price) {
            document.getElementById('sessionId').value = id;
            document.getElementById('modalTitle').innerText = title.toUpperCase();
            document.getElementById('modalPrice').innerHTML = `${price.toLocaleString()} <span>THB</span>`;
            document.getElementById('bookingModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('bookingModal').style.display = 'none';
            document.getElementById('bookingForm').reset();
        }

        function processBooking(event) {
            event.preventDefault();
            
            const payload = {
                session_id: document.getElementById('sessionId').value,
                student_name: document.getElementById('studentName').value,
                parent_email: document.getElementById('parentEmail').value,
                school: document.getElementById('schoolName').value
            };

            console.log("Sending to backend:", payload);
            
            alert(`Initiating checkout sequence for ${payload.student_name}...\n\n(In production, this payload is POSTed to your Python API, which returns a Stripe/Omise checkout URL to redirect the user.)`);
            closeModal();
        }

        // Initialize App
        loadSessions();
    </script>
</body>
</html>
